# 默认设置
default:
  groupCD: 500   # 群聊中所有指令操作冷却时间，单位毫秒,0则无限制
  singleCD: 500 # 群聊中个人操作冷却时间，单位毫秒,0则无限制

  onlyReplyAt: 0 # 是否只关注主动@机器人的消息
  botAlias:      # 机器人别名
    - 云崽
    - 云宝

  addLimit: 0    # 是否限制添加消息
  addPrivate: 1  # 是否允许私聊添加
  addReply: 1    # 是否回复触发消息
  addAt: 0       # 是否提及触发用户
  addRecall: 60  # 是否撤回回复消息

  enable: []     # 启用功能，配置后只有该功能才响应
  disable: []    # 禁用功能

  disabledBots: [] # 账号禁用。账号在群不回应

# Bot单独设置
114514:default:
  onlyReplyAt: 1
  botAlias:
    - 臭崽
    - 臭宝

# 群单独设置
123456:
  groupCD: 500
  singleCD: 500

# [Bot:群]单独设置
114514:123456:
  enable:
  disable: