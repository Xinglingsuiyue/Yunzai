# 自动同意加好友。1-同意 0-不处理
autoFriend: 1
# 自动同意群邀请。0-仅主人 1-所有人
autoGroup: 0
# 当被好友拉进群时，群人数小于配置值自动退出，0则不处理
autoQuit: 50
# 主人帐号
masterQQ:
  - "stdin"
# Bot账号:主人帐号
master:
  - "stdin:stdin"

# 是否禁用私聊，开启后除主人外所有私聊消息一律不响应
disablePrivate: false
# 禁用私聊时的回复提示
disableMsg: "私聊功能已禁用"

#白名单群
whiteGroup:
#白名单用户
whiteUser:
