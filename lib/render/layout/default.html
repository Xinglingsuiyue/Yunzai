<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="shortcut icon" href="#">
    <title>TRSS-Yunzai</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        color: #222;
        background: #f2f4f7;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }
      .container {
        width: fit-content;
        min-width: 420px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .copyright {
        margin-top: 12px;
        color: #8a8f98;
        font-size: 12px;
        text-align: right;
      }
    </style>
    {{block 'css'}}
    {{/block}}
  </head>
  <body class="elem-{{element||elem||'default'}} {{displayMode || mode || 'default'}}-mode {{bodyClass}}" {{sys.scale}}>
    <div class="container" id="container">
      {{block 'main'}}{{/block}}
      <div class="copyright">{{@copyright || sys?.copyright}}</div>
    </div>
  </body>
</html>
