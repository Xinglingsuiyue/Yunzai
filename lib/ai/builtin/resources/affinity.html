<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>好感度</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      color: #3b4737;
      -webkit-font-smoothing: antialiased;
    }
    #container {
      width: 1040px;
      padding: 26px 30px 28px;
      border-radius: 24px;
      background: linear-gradient(160deg, #f8fcf5 0%, #eef6e7 100%);
      border: 1px solid rgba(112, 148, 96, 0.18);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(112, 148, 96, 0.16);
    }
    .heart {
      flex: none;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(80, 120, 70, 0.12);
    }
    .heart svg { width: 26px; height: 26px; }
    .meta { flex: 1; min-width: 0; }
    .title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #35442f;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 12.5px;
      color: #7c8b75;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      flex: none;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(112, 148, 96, 0.22);
      font-size: 12px;
      color: #5c8752;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      column-gap: 22px;
      margin-top: 8px;
    }
    .item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      min-width: 0;
      padding: 7px 0;
    }
    .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13.5px;
      color: #3b4737;
    }
    .uid {
      flex: none;
      font-size: 11px;
      color: #9aa595;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .score {
      flex: none;
      min-width: 40px;
      text-align: right;
      font-size: 14.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .pos { color: #3f9f63; }
    .neg { color: #c26860; }
    .zero { color: #98a393; }
    .empty {
      padding: 34px 0 18px;
      text-align: center;
      font-size: 13px;
      color: #8b9784;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="header">
      <div class="heart">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 20.5S3.8 15.4 3.8 9.3c0-2.7 2.1-4.8 4.7-4.8 1.6 0 3 .9 3.5 2.1.5-1.2 1.9-2.1 3.5-2.1 2.6 0 4.7 2.1 4.7 4.8 0 6.1-8.2 11.2-8.2 11.2Z" fill="#5eaf72"/>
        </svg>
      </div>
      <div class="meta">
        <div class="title">好感度</div>
        <div class="subtitle">群 {{groupName}}({{groupId}}) · 近30天活跃 {{total}} 人</div>
      </div>
      <div class="badge">本群</div>
    </div>
    {{if rows.length}}
    <div class="grid">
      {{each rows row}}
      <div class="item">
        <span class="name">{{row.name}}</span>
        <span class="uid">{{row.uid}}</span>
        <span class="score {{row.tone}}">{{row.score}}</span>
      </div>
      {{/each}}
    </div>
    {{else}}
    <div class="empty">本群近30天还没有活跃记录</div>
    {{/if}}
  </div>
</body>
</html>
